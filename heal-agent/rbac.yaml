# heal-agent 服务账号 (monitoring) + demo 命名空间内的最小权限角色
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: heal-agent
  namespace: monitoring
---
# 仅授予 demo 命名空间的自愈操作权限（最小权限原则）
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heal-agent
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heal-agent
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heal-agent
subjects:
  - kind: ServiceAccount
    name: heal-agent
    namespace: monitoring
