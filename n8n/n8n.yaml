apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: monitoring
spec:
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: monitoring
  labels: {app: n8n}
spec:
  replicas: 1
  selector: {matchLabels: {app: n8n}}
  template:
    metadata:
      labels: {app: n8n}
    spec:
      # 避免同名 Service 注入的 N8N_PORT 等环境变量与 n8n 配置冲突
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
        - name: n8n
          image: n8nio/n8n:1.64.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5678}]
          env:
            - name: N8N_ENCRYPTION_KEY
              value: "selfheal-n8n-enc-key-change-me"
            - name: GENERIC_TIMEZONE
              value: "Asia/Shanghai"
            - name: TZ
              value: "Asia/Shanghai"
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "false"
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_TEMPLATES_ENABLED
              value: "false"
            - name: N8N_PERSONALIZATION_ENABLED
              value: "false"
            - name: N8N_HIRING_BANNER_ENABLED
              value: "false"
          readinessProbe:
            httpGet: {path: /healthz, port: 5678}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 150m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /home/node/.n8n}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: n8n-data}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: monitoring
spec:
  type: NodePort
  selector: {app: n8n}
  ports:
    - {name: http, port: 5678, targetPort: 5678, nodePort: 30567}
